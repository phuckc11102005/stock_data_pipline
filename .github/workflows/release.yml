name: Release — main branch deploy gate

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Final quality gate trước khi vào main
  # ─────────────────────────────────────────────
  quality-gate:
    name: ✅ Full Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort mypy pytest pytest-cov pytest-mock

      - name: Lint check
        run: |
          ruff check . --output-format=github
          black --check .
          isort --check-only .

      - name: Full unit test suite
        run: |
          pytest tests/ \
            -m "not integration and not e2e" \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  # ─────────────────────────────────────────────
  # Tag & Release tự động
  # ─────────────────────────────────────────────
  tag-release:
    name: 🏷️ Create Release Tag
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release tag (date-based)
        id: tag
        run: |
          TAG="release-$(date +'%Y%m%d-%H%M')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🚀 Auto-release from main

            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}

            ### What's included
            - All unit tests passing ✅
            - Coverage ≥ 70% ✅
            - Linting clean ✅
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
